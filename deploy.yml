# 1. Create a Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: full-access-sa
  namespace: default

---
# 2. Create a ClusterRole with full access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: full-access-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---
# 3. Bind the ClusterRole to the Service Account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: full-access-binding
subjects:
  - kind: ServiceAccount
    name: full-access-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: full-access-role
  apiGroup: rbac.authorization.k8s.io

