# 4. Create Boardgame Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame-deployment
spec:
  selector:
    matchLabels:
      app: boardgame
  replicas: 2
  template:
    metadata:
      labels:
        app: boardgame
    spec:
      serviceAccountName: full-access-sa
      containers:
        - name: boardgame
          image: rakesh5293/java-gihub:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

---
# 5. Create Boardgame Service
apiVersion: v1
kind: Service
metadata:
  name: boardgame-ssvc
spec:
  selector:
    app: boardgame
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

