# 4. Create Boardgame Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame-deployment
spec:
  selector:
    matchLabels:
      app: boardgame
  replicas: 2
  template:
    metadata:
      labels:
        app: boardgame
    spec:
      serviceAccountName: full-access-sa
      containers:
        - name: boardgame
          image: rakesh5293/java-gihub:4dd83c3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
