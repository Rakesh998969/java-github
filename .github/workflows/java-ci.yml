name: CI Java 18 App using SonarQube

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 18
      - name: Set up JDK 18
        uses: actions/setup-java@v6
        with:
          java-version: '18'
          distribution: 'temurin'
          cache: maven

      # 3. Verify Java and Maven version
      - name: Check Java Version
        run: |
          java -version
          mvn -version

      # 4. Build + SonarQube Analysis
      - name: Build and SonarQube Analysis
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Boardgame \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # 5. Create short Git commit SHA
      - name: Set Docker Image Tag
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "Docker Image Tag: ${GITHUB_SHA::7}"

      # 6. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t rakesh5293/java-gihub:${SHORT_SHA} .

      # 7. Scan Docker Image with Trivy
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rakesh5293/java-gihub:${{ env.SHORT_SHA }}
          severity: CRITICAL,HIGH
          exit-code: 0

      # 8. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"

      # 9. Push Docker Image to Docker Hub
      - name: Push Docker Image to Docker Hub
        run: |
          docker push rakesh5293/java-gihub:${SHORT_SHA}
      
     
      # 10. Install yq
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

            # 11. Update Kubernetes deployment image
      - name: Update Kubernetes deployment image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}

          yq -i \
            'select(.kind == "Deployment") |
             .spec.template.spec.containers[0].image = "rakesh5293/java-gihub:" + "'"$SHORT_SHA"'"' \
            deployment-service.yaml
      # 12. Commit deployment file changes
      - name: Commit deployment file changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deployment-service.yaml

          git commit -m "Update Docker image tag" || echo "No changes to commit"

          git push origin main


      
