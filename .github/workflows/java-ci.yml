name: CI Java 18 App using SonarQube

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 18
      - name: Set up JDK 18
        uses: actions/setup-java@v6
        with:
          java-version: '18'
          distribution: 'temurin'
          cache: maven

      # 3. Verify Java and Maven version
      - name: Check Java Version
        run: |
          java -version
          mvn -version

      # 4. Build + SonarQube Analysis
      - name: Build and SonarQube Analysis
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Boardgame \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # 5. Build Docker Image
      - name: Build Docker Image
        run: "docker build -t rakesh5293/java-gihub:${GITHUB_SHA::7} ."

      # 6. Scan Docker Image with Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rakesh5293/java-gihub:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0

      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"

      # 8. Push Docker Image to Docker Hub
      - name: Push Docker Image to Docker Hub
        run: "docker push rakesh5293/java-gihub:${GITHUB_SHA::7}"
